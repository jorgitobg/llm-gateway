name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - name: Tests (coverage gate in pyproject, >= 90%)
        run: pytest
      - name: Offline demo is deterministic and matches the README
        run: |
          python -m llm_gateway.demo > demo.out
          python -m llm_gateway.demo > demo2.out
          cmp demo.out demo2.out
          python - <<'PY'
          import re
          readme = open("README.md").read()
          block = re.search(r"```text\n(.*?)\n```", readme, re.S).group(1)
          assert block.strip() == open("demo.out").read().strip(), "README demo output is stale"
          PY
      - name: Wheel installs cleanly and ships the prompt template
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/fresh && /tmp/fresh/bin/pip install -q dist/*.whl
          /tmp/fresh/bin/python -m llm_gateway.demo | tail -2
      - name: Secret scan (full history, gitleaks pinned with checksum)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
